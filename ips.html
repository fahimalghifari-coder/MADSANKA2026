    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.setValueAtTime(130, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.35);
        }
    }

    function triggerVibration() {
        if ("vibrate" in navigator) {
            navigator.vibrate([200, 100, 200]);
        }
    }

    function shuffleArray(array) {
        let cur = array.length, randomIdx;
        while (cur !== 0) {
            randomIdx = Math.floor(Math.random() * cur);
            cur--;
            [array[cur], array[randomIdx]] = [array[randomIdx], array[cur]];
        }
        return array;
    }

    function selectMode(mode) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        let shuffledMaster = shuffleArray([...rawBank]);

        if (mode === 'short') {
            activeBank = shuffledMaster.slice(0, 10);
        } else if (mode === 'exam') {
            activeBank = shuffledMaster.slice(0, 40);
        } else if (mode === 'rank') {
            activeBank = shuffledMaster.slice(0, 60);
        }

        activeBank = activeBank.map(item => {
            let shuffledOpts = shuffleArray([...item.opt]);
            return {
                q: item.q,
                opt: shuffledOpts,
                ans: item.ans,
                exp: item.exp
            };
        });

        document.getElementById("mode-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";

        currentIdx = 0;
        score = 0;
        userAnswers = [];
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        let q = activeBank[currentIdx];

        document.getElementById("question-number").innerText = `Soal ${currentIdx + 1} dari ${activeBank.length}`;
        document.getElementById("score-count").innerText = `Skor: ${score}`;
        document.getElementById("progress-bar").style.width = `${(currentIdx / activeBank.length) * 100}%`;
        document.getElementById("question-text").innerText = q.q;

        q.opt.forEach((o) => {
            let btn = document.createElement("button");
            btn.innerText = o;
            btn.classList.add("option-btn");
            btn.onclick = () => selectAnswer(o, btn);
            document.getElementById("options-container").appendChild(btn);
        });
    }

    function resetState() {
        document.getElementById("next-btn").disabled = true;
        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("options-container").innerHTML = "";
    }

    function selectAnswer(selectedOpt, selectedBtn) {
        let q = activeBank[currentIdx];
        let btns = document.getElementById("options-container").children;

        userAnswers.push({
            q: q.q,
            selected: selectedOpt,
            correct: q.ans,
            exp: q.exp
        });

        if (selectedOpt === q.ans) {
            score += 10;
            selectedBtn.classList.add("correct");
            playSound('correct');
        } else {
            selectedBtn.classList.add("incorrect");
            for (let b of btns) {
                if (b.innerText === q.ans) {
                    b.classList.add("correct");
                }
            }
            playSound('wrong');
            triggerVibration();
        }

        for (let b of btns) b.disabled = true;

        document.getElementById("explanation-text").innerText = q.exp;
        document.getElementById("explanation-box").style.display = "block";
        document.getElementById("score-count").innerText = `Skor: ${score}`;
        document.getElementById("next-btn").disabled = false;
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < activeBank.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";

        let maxScore = activeBank.length * 10;
        document.getElementById("final-score").innerText = `${score} / ${maxScore}`;

        let summary = score >= (maxScore * 0.8) ? "Sangat Baik! Pemahaman materi Anda sangat matang!" : "Bagus! Pelajari kembali poin-poin pembahasan di bawah untuk menyempurnakan nilai.";
        document.getElementById("result-summary").innerText = summary;

        let reviewBox = document.getElementById("review-container");
        reviewBox.innerHTML = "";

        userAnswers.forEach((ans, i) => {
            let isCorrect = ans.selected === ans.correct;
            let div = document.createElement("div");
            div.className = `review-item ${isCorrect ? 'correct-item' : 'incorrect-item'}`;
            div.innerHTML = `
                <div><strong>${i + 1}. ${ans.q}</strong></div>
                <div>Jawaban Anda: ${ans.selected} ${isCorrect ? '✅' : '❌'}</div>
                ${!isCorrect ? `<div style="color: green;">Jawaban Benar: ${ans.correct}</div>` : ''}
                <div style="font-size:0.85rem; color:#555; margin-top:4px;"><strong>Pembahasan:</strong> ${ans.exp}</div>
            `;
            reviewBox.appendChild(div);
        });

        // -------------------------------------------------------------
        // Fungsi Tambahan untuk mencatat bahwa Kuis IPS sudah diselesaikan
        // Menggunakan sessionStorage agar otomatis hilang jika buka tab baru
        // -------------------------------------------------------------
        let riwayat = JSON.parse(sessionStorage.getItem('riwayat_latihan')) || [];
        // Pastikan IPS belum tercatat, jika belum maka tambahkan
        if (!riwayat.includes("Ilmu Pengetahuan Sosial")) {
            riwayat.push("Ilmu Pengetahuan Sosial");
            sessionStorage.setItem('riwayat_latihan', JSON.stringify(riwayat));
        }
    }

    function exitToMenu() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("mode-screen").style.display = "block";
    }
</script>
