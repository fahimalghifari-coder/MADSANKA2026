<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADSANKA IX 2026</title>
    <!-- Menggunakan font Google 'Poppins' untuk tampilan modern dan keren -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Latar belakang gradien agar efek kaca terlihat fresh */
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        /* HEADER (Transparan Timbul ala iOS) */
        header {
            width: 90%;
            max-width: 1200px;
            margin-top: 30px;
            padding: 20px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }

        /* CONTAINER KARTU */
        main {
            width: 90%;
            max-width: 1200px;
            margin: 40px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            flex-grow: 1;
        }

        /* KARTU PELAJARAN */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: var(--glass-shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }

        /* EFEK HOVER KARTU (Timbul saat disentuh/di-hover) */
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #000;
        }

        /* FOOTER */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px 0;
            margin-top: auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: #fff;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Responsivitas untuk layar HP */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            .card {
                font-size: 1rem;
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>MADSANKA IX 2026</h1>
    </header>

    <main>
        <!-- Tautan ini sementara menggunakan '#' sampai link latihan soal diberikan -->
        <a href="#" class="card">1. Bahasa Indonesia</a>
        <a href="#" class="card">2. Matematika</a>
        <a href="#" class="card">3. Ilmu Pengetahuan Alam</a>
        <a href="#" class="card">4. Ilmu Pengetahuan Sosial</a>
        <a href="#" class="card">5. Pancasila</a>
        <a href="#" class="card">6. Seni Rupa</a>
        <a href="#" class="card">7. Informatika</a>
        <a href="#" class="card">8. PJOK</a>
        <a href="#" class="card">9. Bahasa Inggris</a>
        <a href="#" class="card">10. Bahasa Arab</a>
        <a href="#" class="card">11. Bahasa Jawa</a>
        <a href="#" class="card">12. Sejarah Kebudayaan Islam</a>
        <a href="#" class="card">13. Fiqih</a>
        <!-- Jika ada pelajaran ke 14 dan 15 bisa ditambahkan di bawah sini -->
    </main>

    <footer>
        &copy; Fahim Al-Ghifari
    </footer>

</body>
</html>
